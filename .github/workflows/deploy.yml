# Build, tests et déploiement sur GitHub Pages à chaque push sur main.
# Les branches et pull requests sont seulement vérifiées (lint, types, tests, build).
# Le site publie aussi les deux éditions de marque, construites depuis leur branche :
#   /<dépôt>/infosec/      ← version-infosec
#   /<dépôt>/concurrents/  ← version-infosec-concurrents
# Après un push sur l'une de ces branches, relancer ce workflow sur main (Actions → Run workflow)
# pour mettre le site à jour.
name: CI et déploiement

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - name: Build (site + PWA)
        run: npm run build
        env:
          # GitHub Pages sert le site sous /<nom-du-dépôt>/
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build fichier unique
        run: npm run build:single
      - name: Joindre le fichier unique au site
        run: cp dist-single/index.html dist/ups-sizer.html
      - name: Éditions de marque (InfoSec, InfoSec + concurrents)
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          for edition in infosec:version-infosec concurrents:version-infosec-concurrents; do
            dir=${edition%%:*}
            branch=${edition#*:}
            git fetch --depth 1 origin "$branch"
            git worktree add "../$dir" FETCH_HEAD
            (
              cd "../$dir"
              npm ci
              BASE_PATH="/$REPO/$dir/" npm run build
              npm run build:single
              cp dist-single/index.html dist/ups-sizer.html
            )
            cp -r "../$dir/dist" "dist/$dir"
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: ups-sizer-fichier-unique
          path: dist-single/index.html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
